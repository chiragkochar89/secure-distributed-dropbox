syntax = "proto3";

package raft;

// LogEntry metadata structure for Raft consensus log.
// CRITICAL: File content bytes MUST NOT be placed inside the Raft log.
message LogEntry {
  int64 index = 1;
  int64 term = 2;
  string operation = 3;   // e.g., "UPLOAD", "DELETE", "RENAME", "CREATE_VERSION", "DELETE_VERSION"
  string file_id = 4;
  int64 version = 5;
  string filename = 6;
  string sha256 = 7;
  string metadata_json = 8;
}

// RequestVote RPC Arguments
message RequestVoteRequest {
  int64 term = 1;
  string candidate_id = 2;
  int64 last_log_index = 3;
  int64 last_log_term = 4;
}

// RequestVote RPC Results
message RequestVoteResponse {
  int64 term = 1;
  bool vote_granted = 2;
}

// AppendEntries RPC Arguments (Used for both log replication & heartbeats)
// Note: When entries is empty, this RPC serves as a heartbeat.
message AppendEntriesRequest {
  int64 term = 1;
  string leader_id = 2;
  int64 prev_log_index = 3;
  int64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  int64 leader_commit = 6;
}

// AppendEntries RPC Results
message AppendEntriesResponse {
  int64 term = 1;
  bool success = 2;
  int64 match_index = 3;
}

// Transport Ping RPC Messages for peer connectivity health checks
message PingRequest {
  string sender_id = 1;
  int64 timestamp_ms = 2;
}

message PingResponse {
  string node_id = 1;
  int64 timestamp_ms = 2;
  string status = 3;
}

// InstallSnapshot RPC Arguments for transferring compacted snapshots to lagging followers
message InstallSnapshotRequest {
  int64 term = 1;
  string leader_id = 2;
  int64 last_included_index = 3;
  int64 last_included_term = 4;
  int64 offset = 5;
  bytes data = 6;
  bool done = 7;
}

// InstallSnapshot RPC Results
message InstallSnapshotResponse {
  int64 term = 1;
}

// Raft Consensus Service definition for peer-to-peer node communication
service RaftConsensus {
  rpc RequestVote (RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries (AppendEntriesRequest) returns (AppendEntriesResponse);
  rpc Ping (PingRequest) returns (PingResponse);
  rpc InstallSnapshot (InstallSnapshotRequest) returns (InstallSnapshotResponse);
}
