[project]
name = "secure-raft-dropbox"
version = "0.1.0"
description = "Secure Distributed Dropbox Using Raft Consensus"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "python-multipart>=0.0.12",
    "grpcio>=1.68.0",
    "grpcio-tools>=1.68.0",
    "protobuf>=5.29.0",
    "sqlalchemy>=2.0.36",
    "psycopg2-binary>=2.9.10",
    "minio>=7.2.12",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.10.0",
    "cryptography>=44.0.0",
    "prometheus-client>=0.21.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.setuptools.packages.find]
where = ["backend"]

[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"
