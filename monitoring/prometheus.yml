global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'raft-nodes'
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'node-1:8001'
          - 'node-2:8002'
          - 'node-3:8003'
        labels:
          cluster: 'secure-raft-dropbox'
